                        </div>
                    )}

                    {/* Summary Stats */}
                    <div className="dashboard-charts-section">
                        <h3 className="section-title-dashboard">
                            <i className="fas fa-info-circle"></i>
                            Summary Statistics
                        </h3>
                        <div className="stats-row" style={{ marginTop: '20px' }}>
                            <div className="stat-card">
                                <h3>Total Applications</h3>
                                <div className="stat-value">{analytics.total}</div>
                            </div>
                            <div className="stat-card">
                                <h3>Pending Review</h3>
                                <div className="stat-value" style={{ color: '#ff9800' }}>{analytics.statusCounts.pending}</div>
                            </div>
                            <div className="stat-card">
                                <h3>Shortlisted</h3>
                                <div className="stat-value" style={{ color: '#66bb6a' }}>{analytics.statusCounts.shortlisted}</div>
                            </div>
                            <div className="stat-card">
                                <h3>Rejected</h3>
                                <div className="stat-value" style={{ color: '#f44336' }}>{analytics.statusCounts.rejected}</div>
                            </div>
                            <div className="stat-card">
                                <h3>Total Interviews</h3>
                                <div className="stat-value" style={{ color: '#2196f3' }}>{interviews.length}</div>
                            </div>
                            <div className="stat-card">
                                <h3>Unique Positions</h3>
                                <div className="stat-value" style={{ color: '#9c27b0' }}>{Object.keys(analytics.positionCounts).length}</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Enhanced Admin Dashboard Component with Tabs
        const AdminDashboard = ({ adminUser, onLogout }) => {
            const [applications, setApplications] = useState([]);
            const [interviews, setInterviews] = useState([]);
            const [loading, setLoading] = useState(true);
            const [refreshing, setRefreshing] = useState(false);
            const [activeTab, setActiveTab] = useState('all');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCandidates, setSelectedCandidates] = useState([]);
            const [expandedRows, setExpandedRows] = useState(new Set());
            const [emailModal, setEmailModal] = useState({ isOpen: false, template: '', title: '', candidates: [], subject: '' });
            const [interviewModal, setInterviewModal] = useState({ isOpen: false, candidate: null });
            const [cvModal, setCvModal] = useState({ isOpen: false, cvUrl: '', candidateName: '' });
            const [editModal, setEditModal] = useState({ isOpen: false, applicant: null });

            // Filters for All Applicants view
            const [statusFilter, setStatusFilter] = useState('all');
            const [positionFilter, setPositionFilter] = useState('all');
            const [dateFromFilter, setDateFromFilter] = useState('');
            const [dateToFilter, setDateToFilter] = useState('');

            // Filters for Interviews view
            const [interviewStatusFilter, setInterviewStatusFilter] = useState('all');
            const [interviewDateFromFilter, setInterviewDateFromFilter] = useState('');
            const [interviewDateToFilter, setInterviewDateToFilter] = useState('');
            const [interviewerFilter, setInterviewerFilter] = useState('all');

            // Email templates as state for customization
            const [emailTemplates, setEmailTemplates] = useState({
                confirmation: `Dear [Candidate Name],

Thank you for your interest in our position. We have received your application and our team is currently reviewing it.

We will contact you within the next few days regarding the next steps in the selection process.

Best regards,
HR Team`,

                shortlist: `Dear [Candidate Name],

Congratulations! We are pleased to inform you that you have been shortlisted for the [Position] role.

We would like to invite you for an interview. Our HR team will contact you shortly to schedule a convenient time.

Best regards,
HR Team`,

                interview: `Dear [Candidate Name],

We are pleased to invite you for an interview for the [Position] role.

Interview Details:
Date: [Date]
Time: [Time]
Location: [Location/Meeting Link]
Interviewer: [Interviewer Name]

Please confirm your availability for the scheduled time.

Best regards,
HR Team`,

                rejection: `Dear [Candidate Name],

Thank you for your interest in the [Position] role and for taking the time to apply.

After careful consideration, we have decided to move forward with other candidates whose qualifications more closely match our current requirements.

We will keep your resume on file for future opportunities that match your profile.

Best regards,
HR Team`
            });

            // Job Description state
            const [jobDescription, setJobDescription] = useState('We are looking for a talented professional to join our team. The ideal candidate should have excellent skills and a passion for excellence.');

            // Fetch applications on mount
            React.useEffect(() => {
                fetchApplications();
                fetchInterviews();
                loadEmailTemplates();
                loadJobDescription();
            }, []);

            // Load job description from Google Sheets
            const loadJobDescription = () => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((description) => {
                            setJobDescription(description);
                            console.log('Job description loaded from Google Sheets');
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load job description:', error);
                        })
                        .getJobDescription();
                }
            };

            // Load email templates from Google Sheets
            const loadEmailTemplates = () => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((templates) => {
                            setEmailTemplates(templates);
                            console.log('Email templates loaded from Google Sheets');
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load email templates:', error);
                        })
                        .getEmailTemplates();
                }
            };

            const fetchApplications = (isRefresh = false) => {
                if (isRefresh) {
                    setRefreshing(true);
                } else {
                    setLoading(true);
                }

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((data) => {
                            // Add status field to each application
                            const appsWithStatus = data.map(app => ({
                                ...app,
                                status: app.status || 'pending'
                            }));
                            setApplications(appsWithStatus);
                            setLoading(false);
                            setRefreshing(false);
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to fetch applications:', error);
                            setLoading(false);
                            setRefreshing(false);
                        })
                        .getAllApplicationsWithStatus();
                } else {
                    // Demo data for testing
                    setTimeout(() => {
                        const demoData = [
                            {
                                timestamp: '2025-10-09T10:30:00Z',
                                firstName: 'John',
                                lastName: 'Doe',
                                email: 'john.doe@example.com',
                                mobile: '+1234567890',
                                nationality: 'USA',
                                yearsOfExperience: '5',
                                cvUrl: 'https://drive.google.com/file/d/DEMO_FILE_ID/view',
                                status: 'pending'
                            },
                            {
                                timestamp: '2025-10-09T09:15:00Z',
                                firstName: 'Jane',
                                lastName: 'Smith',
                                email: 'jane.smith@example.com',
                                mobile: '+0987654321',
                                nationality: 'UK',
                                yearsOfExperience: '3',
                                cvUrl: 'https://drive.google.com/file/d/DEMO_FILE_ID_2/view',
                                status: 'shortlisted'
                            },
                            {
                                timestamp: '2025-10-08T14:20:00Z',
                                firstName: 'Mike',
                                lastName: 'Johnson',
                                email: 'mike.j@example.com',
                                mobile: '+1122334455',
                                nationality: 'Canada',
                                yearsOfExperience: '7',
                                cvUrl: 'https://drive.google.com/file/d/DEMO_FILE_ID_3/view',
                                status: 'rejected'
                            }
                        ];
                        setApplications(demoData);
                        setLoading(false);
                        setRefreshing(false);
                    }, 1000);
                }
            };

            const fetchInterviews = (isRefresh = false) => {
                if (isRefresh) {
                    setRefreshing(true);
                }

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((data) => {
                            setInterviews(data || []);
                            setRefreshing(false);
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to fetch interviews:', error);
                            setRefreshing(false);
                        })
                        .getAllInterviews();
                } else {
                    // Helper function to extract time from ISO date
                    const extractTimeFromISO = (isoString) => {
                        const date = new Date(isoString);
                        const hours = date.getHours();
                        const minutes = String(date.getMinutes()).padStart(2, '0');
                        const seconds = String(date.getSeconds()).padStart(2, '0');
                        const ampm = hours >= 12 ? 'PM' : 'AM';
                        const displayHour = hours % 12 || 12;
                        return `${displayHour}:${minutes}:${seconds} ${ampm}`;
                    };

                    // Demo data for testing
                    const demoInterviews = [
                        {
                            scheduledAt: '2025-10-09T08:00:00Z',
                            candidateEmail: 'jane.smith@example.com',
                            candidateName: 'Jane Smith',
                            interviewDateTime: '2025-10-15T10:30:00.000Z',
                            interviewTime: extractTimeFromISO('2025-10-15T10:30:00.000Z'),
                            location: 'Office - Meeting Room A',
                            interviewer: 'John Manager',
                            notes: 'Technical interview for senior position',
                            status: 'Scheduled'
                        },
                        {
                            scheduledAt: '2025-10-09T09:00:00Z',
                            candidateEmail: 'john.doe@example.com',
                            candidateName: 'John Doe',
                            interviewDateTime: '2025-10-16T14:00:00.000Z',
                            interviewTime: extractTimeFromISO('2025-10-16T14:00:00.000Z'),
                            location: 'https://meet.google.com/abc-defg-hij',
                            interviewer: 'Sarah HR',
                            notes: 'Initial screening call',
                            status: 'Scheduled'
                        }
                    ];
                    setInterviews(demoInterviews);
                    setRefreshing(false);
                }
            };

            // Handle refresh based on active tab
            const handleRefresh = () => {
                if (activeTab === 'interviews') {
                    fetchInterviews(true);
                } else {
                    fetchApplications(true);
                }
            };

            // Filter applications based on active tab and search
            const getFilteredApplications = () => {
                let filtered = applications;

                // Filter by tab
                if (activeTab === 'shortlisted') {
                    filtered = filtered.filter(app => app.status === 'shortlisted');
                } else if (activeTab === 'rejected') {
                    filtered = filtered.filter(app => app.status === 'rejected');
                }

                // Filter by search term
                if (searchTerm) {
                    filtered = filtered.filter(app =>
                        Object.values(app).some(value =>
                            value && value.toString().toLowerCase().includes(searchTerm.toLowerCase())
                        )
                    );
                }

                return filtered;
            };

            const handleStatusChange = (candidate, newStatus) => {
                // Update local state
                setApplications(apps =>
                    apps.map(app =>
                        app.email === candidate.email ? { ...app, status: newStatus } : app
                    )
                );

                // Update in backend
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(() => {
                            console.log(`Status updated for ${candidate.email} to ${newStatus}`);
                            // Automatic emails removed - admins will send emails manually when needed
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to update status:', error);
                        })
                        .updateCandidateStatus(candidate.email, newStatus);
                }
            };

            const handleSendEmail = (candidate, template, subject) => {
                const personalizedTemplate = template
                    .replace('[Candidate Name]', `${candidate.firstName} ${candidate.lastName}`)
                    .replace('[Position]', 'Job Position');

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(() => {
                            alert(`Email sent to ${candidate.email}`);
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to send email:', error);
                        })
                        .sendEmailToCandidate(candidate.email, subject, personalizedTemplate);
                } else {
                    alert(`Email would be sent to ${candidate.email}:\n\n${personalizedTemplate}`);
                }
            };

            const handleUpdateApplication = (updateData) => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(() => {
                            alert('Application updated successfully');
                            fetchApplications(true); // Refresh applications list
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to update application:', error);
                            alert('Failed to update application. Please try again.');
                        })
                        .updateApplication(updateData);
                } else {
                    alert(`Demo: Would update application for ${updateData.email}`);
                    // In demo mode, update local state
                    setApplications(apps =>
                        apps.map(app =>
                            app.email === updateData.email ? { ...app, ...updateData } : app
                        )
                    );
                }
            };

            const handleBulkAction = (action) => {
                if (selectedCandidates.length === 0) {
                    alert('Please select at least one candidate');
                    return;
                }

                const selectedApps = applications.filter(app =>
                    selectedCandidates.includes(app.email)
                );

                switch (action) {
                    case 'shortlist':
                        selectedApps.forEach(app => handleStatusChange(app, 'shortlisted'));
                        break;
                    case 'reject':
                        selectedApps.forEach(app => handleStatusChange(app, 'rejected'));
                        break;
                    case 'email':
                        setEmailModal({
                            isOpen: true,
                            template: emailTemplates.confirmation,
                            title: `Send Email to ${selectedCandidates.length} Candidates`,
                            candidates: selectedApps,
                            subject: 'Application Received - Confirmation'
                        });
                        break;
                    case 'regret':
                        setEmailModal({
                            isOpen: true,
                            template: emailTemplates.rejection,
                            title: `Send Regret Mail to ${selectedCandidates.length} Candidates`,
                            candidates: selectedApps,
                            subject: 'Application Status Update'
                        });
                        break;
                }

                // Clear selection only for non-email actions
                if (action !== 'email' && action !== 'regret') {
                    setSelectedCandidates([]);
                }
            };

            const handleViewCV = (candidate) => {
                if (candidate.cvUrl && candidate.cvUrl !== '' && !candidate.cvUrl.startsWith('Upload Failed')) {
                    setCvModal({
                        isOpen: true,
                        cvUrl: candidate.cvUrl,
                        candidateName: `${candidate.firstName} ${candidate.lastName}`
                    });
                } else {
                    alert('CV not available or upload failed');
                }
            };

            const handleScheduleInterview = (interviewData) => {
                const isReschedule = interviewData.isReschedule || false;
                const successMessage = isReschedule
                    ? 'Interview rescheduled and update notification sent'
                    : 'Interview scheduled and invitation sent';

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    const backendFunction = isReschedule ? 'rescheduleInterview' : 'scheduleInterview';
                    google.script.run
                        .withSuccessHandler(() => {
                            alert(successMessage);
                            fetchInterviews(); // Refresh interviews list
                        })
                        .withFailureHandler((error) => {
                            console.error(`Failed to ${isReschedule ? 'reschedule' : 'schedule'} interview:`, error);
                            alert(`Failed to ${isReschedule ? 'reschedule' : 'schedule'} interview. Please try again.`);
                        })
                        [backendFunction](interviewData);
                } else {
                    alert(`Interview ${isReschedule ? 'rescheduled' : 'scheduled'} for ${interviewData.candidateEmail}`);
                    fetchInterviews(); // Refresh interviews list
                }
            };

            const toggleExpandRow = (email) => {
                setExpandedRows(prev => {
                    const newSet = new Set(prev);
                    if (newSet.has(email)) {
                        newSet.delete(email);
                    } else {
                        newSet.add(email);
                    }
                    return newSet;
                });
            };

            const clearFilters = () => {
                setStatusFilter('all');
                setPositionFilter('all');
                setDateFromFilter('');
                setDateToFilter('');
            };

            const clearInterviewFilters = () => {
                setInterviewStatusFilter('all');
                setInterviewDateFromFilter('');
                setInterviewDateToFilter('');
                setInterviewerFilter('all');
            };

            const getFilteredInterviews = () => {
                let filtered = interviews;

                // Apply status filter
                if (interviewStatusFilter !== 'all') {
                    filtered = filtered.filter(interview =>
                        interview.status?.toLowerCase() === interviewStatusFilter.toLowerCase()
                    );
                }

                // Apply interviewer filter
                if (interviewerFilter !== 'all') {
                    filtered = filtered.filter(interview => interview.interviewer === interviewerFilter);
                }

                // Apply date from filter
                if (interviewDateFromFilter) {
                    const fromDate = new Date(interviewDateFromFilter);
                    fromDate.setHours(0, 0, 0, 0);
                    filtered = filtered.filter(interview => {
                        const interviewDate = new Date(interview.interviewDateTime);
                        return interviewDate >= fromDate;
                    });
                }

                // Apply date to filter
                if (interviewDateToFilter) {
                    const toDate = new Date(interviewDateToFilter);
                    toDate.setHours(23, 59, 59, 999);
                    filtered = filtered.filter(interview => {
                        const interviewDate = new Date(interview.interviewDateTime);
                        return interviewDate <= toDate;
                    });
                }

                // Apply search filter
                if (searchTerm) {
                    filtered = filtered.filter(interview =>
                        Object.values(interview).some(value =>
                            value && value.toString().toLowerCase().includes(searchTerm.toLowerCase())
                        )
                    );
                }

                return filtered;
            };

            const getFilteredApplicationsForApplicantsTab = () => {
                let filtered = applications;

                // Apply status filter
                if (statusFilter !== 'all') {
                    filtered = filtered.filter(app => app.status === statusFilter);
                }

                // Apply position filter
                if (positionFilter !== 'all') {
                    filtered = filtered.filter(app =>
                        app.applyingFor && app.applyingFor.toLowerCase() === positionFilter.toLowerCase()
                    );
                }

                // Apply date from filter
                if (dateFromFilter) {
                    const fromDate = new Date(dateFromFilter);
                    fromDate.setHours(0, 0, 0, 0);
                    filtered = filtered.filter(app => {
                        const appDate = new Date(app.timestamp);
                        return appDate >= fromDate;
                    });
                }

                // Apply date to filter
                if (dateToFilter) {
                    const toDate = new Date(dateToFilter);
                    toDate.setHours(23, 59, 59, 999);
                    filtered = filtered.filter(app => {
                        const appDate = new Date(app.timestamp);
                        return appDate <= toDate;
                    });
                }

                // Apply search filter
                if (searchTerm) {
                    filtered = filtered.filter(app =>
                        Object.values(app).some(value =>
                            value && value.toString().toLowerCase().includes(searchTerm.toLowerCase())
                        )
                    );
                }

                return filtered;
            };

            const filteredApplications = activeTab === 'applicants'
                ? getFilteredApplicationsForApplicantsTab()
                : getFilteredApplications();

            const filteredInterviews = activeTab === 'interviews'
                ? getFilteredInterviews()
                : interviews;

            // Get unique interviewers for filter dropdown
            const uniqueInterviewers = [...new Set(interviews.map(interview => interview.interviewer).filter(Boolean))];

            // Get unique positions for filter dropdown
            const uniquePositions = [...new Set(applications.map(app => app.applyingFor).filter(Boolean))];

            const tabCounts = {
                all: applications.length,
                shortlisted: applications.filter(app => app.status === 'shortlisted').length,
                rejected: applications.filter(app => app.status === 'rejected').length,
                interviews: interviews.length
            };

            return (
                <div className="dashboard-container">
                    <div className="dashboard-header">
                        <div className="dashboard-title">
                            <i className="fas fa-users-cog" style={{ fontSize: '28px' }}></i>
                            <h1>Candidate Management System</h1>
                        </div>
                        <div className="admin-info">
                            <div className="admin-name">
                                <i className="fas fa-user-circle"></i>
                                <span>Welcome, {adminUser.username}</span>
                            </div>
                            <button className="logout-btn" onClick={onLogout}>
                                <i className="fas fa-sign-out-alt"></i>
                                Logout
                            </button>
                        </div>

                        {/* CV Bank Button */}
                        <div style={{ padding: '0 24px', marginTop: '16px' }}>
                            <button
                                className={`tab-btn ${activeTab === 'all' ? 'active' : ''}`}
                                onClick={() => setActiveTab('all')}
                                style={{
                                    width: '100%',
                                    justifyContent: 'space-between',
                                    backgroundColor: activeTab === 'all' ? '#2e7d32' : '#f8f9fa',
                                    color: activeTab === 'all' ? '#fff' : '#333',
                                    borderLeft: activeTab === 'all' ? '4px solid #1b5e20' : '4px solid transparent'
                                }}
                            >
                                <span><i className="fas fa-database"></i> CV Bank</span>
                                <span className="tab-badge">{tabCounts.all}</span>
                            </button>
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="tabs-container">
                        <div className="tabs">
                            <button
                                className={`tab-btn ${activeTab === 'dashboard' ? 'active' : ''}`}
                                onClick={() => setActiveTab('dashboard')}
                            >
                                <i className="fas fa-chart-pie"></i> Dashboard
                            </button>
                            <button
                                className={`tab-btn ${activeTab === 'applicants' ? 'active' : ''}`}
                                onClick={() => setActiveTab('applicants')}
                            >
                                <i className="fas fa-users"></i> All Applicants
                                <span className="tab-badge">{tabCounts.all}</span>
                            </button>
                            <button
                                className={`tab-btn ${activeTab === 'shortlisted' ? 'active' : ''}`}
                                onClick={() => setActiveTab('shortlisted')}
                            >
                                Shortlisted
                                <span className="tab-badge">{tabCounts.shortlisted}</span>
                            </button>
                            <button
                                className={`tab-btn ${activeTab === 'interviews' ? 'active' : ''}`}
                                onClick={() => setActiveTab('interviews')}
                            >
                                <i className="fas fa-calendar-check"></i> Interviews
                                <span className="tab-badge">{tabCounts.interviews || 0}</span>
                            </button>
                            <button
                                className={`tab-btn ${activeTab === 'rejected' ? 'active' : ''}`}
                                onClick={() => setActiveTab('rejected')}
                            >
                                Rejected
                                <span className="tab-badge">{tabCounts.rejected}</span>
                            </button>
                            <button
                                className={`tab-btn ${activeTab === 'settings' ? 'active' : ''}`}
                                onClick={() => setActiveTab('settings')}
                            >
                                <i className="fas fa-cog"></i> Settings
                            </button>
                        </div>
                    </div>

                    {/* Bulk Actions Bar */}
                    {selectedCandidates.length > 0 && activeTab !== 'settings' && activeTab !== 'interviews' && (
                        <div className="bulk-actions">
                            <span className="selected-count">
                                {selectedCandidates.length} selected
                            </span>
                            {activeTab === 'rejected' ? (
                                // Show only Send Regret Mail button for rejected tab
                                <button className="action-btn btn-reject" onClick={() => handleBulkAction('regret')}>
                                    <i className="fas fa-envelope"></i> Send Regret Mail
                                </button>
                            ) : (
                                // Show only Send Email button for other tabs
                                <button className="action-btn btn-interview" onClick={() => handleBulkAction('email')}>
                                    <i className="fas fa-envelope"></i> Send Email
                                </button>
                            )}
                        </div>
                    )}

                    <div className="dashboard-content">
                        {/* Search Box */}
                        <div className="table-header">
                            <h2>
                                {activeTab === 'dashboard' && 'Analytics Dashboard'}
                                {activeTab === 'all' && 'CV Bank'}
                                {activeTab === 'applicants' && 'All Applicants - Detailed View'}
                                {activeTab === 'shortlisted' && 'Shortlisted Candidates'}
                                {activeTab === 'interviews' && 'Scheduled Interviews'}
                                {activeTab === 'rejected' && 'Rejected Candidates'}
                                {activeTab === 'settings' && 'Application Settings'}
                            </h2>
                            {activeTab !== 'settings' && activeTab !== 'dashboard' && (
                                <div className="table-header-actions">
                                    {(activeTab === 'shortlisted' || activeTab === 'rejected') && (
                                        <button
                                            className="action-btn"
                                            onClick={() => {
                                                const filtered = getFilteredApplications();
                                                if (selectedCandidates.length === filtered.length && filtered.length > 0) {
                                                    // Unmark all
                                                    setSelectedCandidates([]);
                                                } else {
                                                    // Mark all
                                                    setSelectedCandidates(filtered.map(app => app.email));
                                                }
                                            }}
                                            style={{
                                                background: selectedCandidates.length > 0 ? '#ff9800' : '#2e7d32',
                                                fontSize: '13px',
                                                padding: '8px 16px',
                                                marginRight: '10px'
                                            }}
                                        >
                                            <i className={`fas ${selectedCandidates.length > 0 ? 'fa-times-circle' : 'fa-check-square'}`}></i>
                                            {selectedCandidates.length > 0 ? 'Unmark All' : 'Mark All'}
                                        </button>
                                    )}
                                    <button
                                        className={`refresh-btn ${refreshing ? 'refreshing' : ''}`}
                                        onClick={handleRefresh}
                                        disabled={refreshing}
                                        title="Refresh data"
                                    >
                                        <i className="fas fa-sync-alt"></i>

                            <label htmlFor="currentlyWorking" style={{ marginBottom: 0 }}>
                                Currently working here
                            </label>
                        </div>
                    </>
                )}
            </div>
        );

        // CV Upload Section
        const CVUploadSection = ({ fileName, handleFileChange }) => (
            <div className="section">
                <div className="section-header">
                    <div className="section-number">5</div>
                    <h2 className="section-title">Upload Your CV <span style={{ color: '#d32f2f' }}>*</span></h2>
                </div>

                <div className="file-upload">
                    <label htmlFor="cvUpload" className="file-upload-label">
                        <div className="file-upload-icon">
                            <i className="fas fa-file-upload"></i>
                        </div>
                        <h3 style={{ color: '#2e7d32', marginBottom: '8px' }}>
                            {fileName || 'Click to upload your CV (Required)'}
                        </h3>
                        <p style={{ color: '#66bb6a', fontSize: '14px' }}>
                            Supported format: PDF only (Max 5MB)
                        </p>
                    </label>
                    <input
                        type="file"
                        id="cvUpload"
                        accept=".pdf"
                        onChange={handleFileChange}
                        required={true}
                    />
                </div>
            </div>
        );

        // Main App Component
        const JobApplicationForm = () => {
            const [currentlyWorking, setCurrentlyWorking] = useState(false);
            const [isFresher, setIsFresher] = useState(false);
            const [fileName, setFileName] = useState('');
            const [cvFile, setCvFile] = useState(null);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitMessage, setSubmitMessage] = useState(null);
            const [showCongratsModal, setShowCongratsModal] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminUser, setAdminUser] = useState(null);
            const [jobDescription, setJobDescription] = useState('We are looking for a talented professional to join our team. The ideal candidate should have excellent skills and a passion for excellence.');

            // Load job description on component mount
            React.useEffect(() => {
                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler((description) => {
                            setJobDescription(description);
                        })
                        .withFailureHandler((error) => {
                            console.error('Failed to load job description:', error);
                        })
                        .getJobDescription();
                }
            }, []);

            // Add/remove dashboard-active class on body when admin is logged in
            React.useEffect(() => {
                if (isAdminLoggedIn) {
                    document.body.classList.add('dashboard-active');
                    document.body.classList.remove('form-active');
                } else {
                    document.body.classList.remove('dashboard-active');
                    document.body.classList.add('form-active');
                }
                return () => {
                    document.body.classList.remove('dashboard-active');
                    document.body.classList.remove('form-active');
                };
            }, [isAdminLoggedIn]);

            const [formData, setFormData] = useState({
                // Position Applying For
                applyingFor: '',

                // Personal Info
                firstName: '',
                lastName: '',
                email: '',
                mobile: '',
                dob: '',
                religion: '',
                maritalStatus: '',
                gender: '',
                nationality: '',
                currentAddress: '',
                permanentAddress: '',

                // SSC
                sscInstitute: '',
                sscBoard: '',
                sscMajor: '',
                sscYear: '',
                sscGrade: '',

                // HSC
                hscInstitute: '',
                hscBoard: '',
                hscMajor: '',
                hscYear: '',
                hscGrade: '',

                // Bachelor
                bachelorDegree: '',
                bachelorInstitute: '',
                bachelorMajor: '',
                bachelorGrade: '',

                // Postgraduate
                postgraduateDegree: '',
                postgraduateInstitute: '',
                postgraduateMajor: '',
                postgraduateGrade: '',

                // Experience
                yearsOfExperience: '',
                lastOrganisation: '',
                lastDesignation: '',
                joiningDate: '',
                endDate: ''
            });

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const handleFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    // Check file type (PDF only)
                    if (!file.name.toLowerCase().endsWith('.pdf')) {
                        alert('Only PDF files are allowed. Please upload a PDF file.');
                        e.target.value = ''; // Clear the file input
                        return;
                    }
                    // Check file size (5MB limit)
                    if (file.size > 5 * 1024 * 1024) {
                        alert('File size must be less than 5MB');
                        e.target.value = ''; // Clear the file input
                        return;
                    }

                    // Convert file to base64
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setFileName(file.name);
                        setCvFile(event.target.result); // Store base64 data
                    };
                    reader.onerror = (error) => {
                        console.error('Error reading file:', error);
                        alert('Failed to read the file. Please try again.');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAdminLogin = (user) => {
                setIsAdminLoggedIn(true);
                setAdminUser(user);
                setShowLoginModal(false);
                console.log('Admin logged in:', user);
            };

            const handleAdminLogout = () => {
                setIsAdminLoggedIn(false);
                setAdminUser(null);
                // Clear any admin-related data
            };

            const handleSubmit = async (e) => {
                e.preventDefault();

                // Validate CV upload
                if (!fileName || !cvFile) {
                    alert('Please upload your CV (PDF format required)');
                    return;
                }

                setIsSubmitting(true);
                setSubmitMessage(null);

                try {
                    // Convert date values to ISO format
                    const formatDateToISO = (dateValue) => {
                        if (!dateValue) return '';
                        // For date inputs (YYYY-MM-DD), create date at midnight UTC to avoid timezone shifts
                        // For datetime-local inputs (YYYY-MM-DDTHH:MM), use the provided time
                        const date = new Date(dateValue);
                        if (dateValue.includes('T')) {
                            // Has time component (datetime-local)
                            return date.toISOString(); // Returns "2025-10-09T05:05:00.000Z"
                        } else {
                            // Date only - set to midnight UTC
                            const [year, month, day] = dateValue.split('-');
                            const utcDate = new Date(Date.UTC(year, month - 1, day, 0, 0, 0, 0));
                            return utcDate.toISOString(); // Returns "2025-10-14T00:00:00.000Z"
                        }
                    };

                    // Prepare submission data with ISO formatted dates
                    const submissionData = {
                        ...formData,
                        dob: formatDateToISO(formData.dob),
                        joiningDate: formatDateToISO(formData.joiningDate),
                        endDate: formatDateToISO(formData.endDate),
                        currentlyWorking: currentlyWorking
                    };

                    // Check if google.script.run is available (running in GAS environment)
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        // Running in Google Apps Script environment
                        google.script.run
                            .withSuccessHandler((response) => {
                                setIsSubmitting(false);
                                if (response.status === 'success') {
                                    // Show congratulations modal
                                    setShowCongratsModal(true);
                                } else {
                                    setSubmitMessage({
                                        type: 'error',
                                        text: response.message || 'Failed to submit application. Please try again.'
                                    });
                                }
                            })
                            .withFailureHandler((error) => {
                                setIsSubmitting(false);
                                setSubmitMessage({
                                    type: 'error',
                                    text: 'An error occurred: ' + error.message
                                });
                            })
                            .submitJobApplication(submissionData, fileName, cvFile);
                    } else {
                        // Running standalone (for testing)
                        setTimeout(() => {
                            setIsSubmitting(false);
                            const submissionTime = new Date().toISOString();
                            // Show congratulations modal
                            setShowCongratsModal(true);
                            console.log('Submission Time (ISO 8601):', submissionTime);
                            console.log('Form Data:', submissionData);
                            console.log('CV File:', fileName);
                        }, 2000);
                    }

                } catch (error) {
                    setIsSubmitting(false);
                    setSubmitMessage({
                        type: 'error',
                        text: 'Failed to submit application. Please try again.'
                    });
                    console.error('Submission error:', error);
                }
            };

            // If admin is logged in, show dashboard
            if (isAdminLoggedIn && adminUser) {
                return (
                    <AdminDashboard
                        adminUser={adminUser}
                        onLogout={handleAdminLogout}
                    />
                );
            }

            // Otherwise, show the application form
            return (
                <>
                    {isSubmitting && (
                        <div className="loading-overlay">
                            <div className="loading-spinner">
                                <div className="spinner"></div>
                                <h3 style={{ color: '#2e7d32', marginBottom: '8px' }}>Submitting Application...</h3>
                                <p style={{ color: '#66bb6a', fontSize: '14px' }}>Please wait while we process your application</p>
                            </div>
                        </div>
                    )}

                    <CongratsModal
                        isOpen={showCongratsModal}
                        onClose={() => {
                            setShowCongratsModal(false);
                            window.location.reload(); // Reload to reset the form
                        }}
                        applicantName={formData.firstName}
                        applicantEmail={formData.email}
                    />

                    <AdminLoginModal
                        isOpen={showLoginModal}
                        onClose={() => setShowLoginModal(false)}
                        onLoginSuccess={handleAdminLogin}
                    />

                    <div className="container">
                        <div className="header">
                            <button className="admin-btn" onClick={() => setShowLoginModal(true)}>
                                <i className="fas fa-user-shield"></i>
                                Admin
                            </button>
                            <h1>Membership Registration Form</h1>
                            <p>Kindly complete the membership application form below.</p>
                        </div>

                        <form onSubmit={handleSubmit} className="form-content">
                            {submitMessage && (
                                <div className={`message-box ${submitMessage.type}`}>
                                    <i className={`fas fa-${submitMessage.type === 'success' ? 'check-circle' : 'exclamation-circle'}`}></i>
                                    <div>
                                        <strong>{submitMessage.type === 'success' ? 'Success!' : 'Error!'}</strong>
                                        <p style={{ margin: '5px 0 0 0' }}>{submitMessage.text}</p>
                                    </div>
                                </div>
                            )}

                            <JobDescriptionSection jobDescription={jobDescription} />
                            <PersonalInfoSection formData={formData} handleChange={handleChange} />
                            <EducationSection formData={formData} handleChange={handleChange} />
                            <ExperienceSection
                                formData={formData}
                                handleChange={handleChange}
                                currentlyWorking={currentlyWorking}
                                setCurrentlyWorking={setCurrentlyWorking}
                                isFresher={isFresher}
                                setIsFresher={setIsFresher}
                            />
                            <CVUploadSection fileName={fileName} handleFileChange={handleFileChange} />

                            <button type="submit" className="submit-btn" disabled={isSubmitting}>
                                {isSubmitting ? 'Submitting...' : 'Submit Application'}
                            </button>
                        </form>
                    </div>
                </>
            );
        };

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<JobApplicationForm />);
    </script>
</body>
</html>
